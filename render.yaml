services:
  - type: web
    name: competition-odds
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /api/status
    envVars:
      # Anahtarlar Render panelinden girilir, dosyaya yazılmaz.
      - key: FOOTBALL_DATA_TOKEN
        sync: false
      - key: ODDS_API_KEY
        sync: false
      - key: EXTRA_LEAGUES
        value: ''
